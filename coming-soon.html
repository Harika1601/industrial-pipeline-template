<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon | PipelineInspect</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
font-family:'Segoe UI',sans-serif;
text-align:center;
}

.container-box{
max-width:700px;
}

.icon{
font-size:60px;
margin-bottom:20px;
}

.countdown{
font-size:28px;
font-weight:bold;
margin:20px 0;
}

input{
max-width:350px;
margin:auto;
}

</style>

</head>

<body>

<div class="container-box">

<i class="fa-solid fa-hourglass-half icon"></i>

<h1 class="display-4 fw-bold">Coming Soon</h1>

<p class="lead">
We are working hard to launch this feature soon.
Stay tuned for exciting updates from PipelineInspect.
</p>


<!-- Countdown Timer -->

<div class="countdown" id="countdown">
Launching Soon...
</div>


<!-- Email Notification -->

<div class="mt-4">

<input type="email" class="form-control mb-3" placeholder="Enter your email">

<button class="btn btn-light">
Notify Me
</button>

</div>


<!-- Home Button -->

<div class="mt-4">

<a href="index.html" class="btn btn-outline-light btn-lg">
<i class="fa-solid fa-house"></i> Back to Home
</a>

</div>

</div>


<script>

/* Countdown Timer */

var countDownDate = new Date("Dec 31, 2026 00:00:00").getTime();

var x = setInterval(function(){

var now = new Date().getTime();
var distance = countDownDate - now;

var days = Math.floor(distance / (1000 * 60 * 60 * 24));
var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
var seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("countdown").innerHTML =
days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

if(distance < 0){
clearInterval(x);
document.getElementById("countdown").innerHTML = "Launched!";
}

},1000);

</script>

</body>
</html>
